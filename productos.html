<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincón de Moda - Catálogo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fcfcfc;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Contenedor principal para las fotos */
        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tarjeta de producto */
        .producto {
            background-color: white;
            border-radius: 15px;
            width: 250px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .producto:hover {
            transform: scale(1.03);
        }

        /* Espacio para la foto */
        .producto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #f0f0f0;
        }

        .nombre {
            font-size: 1.1rem;
            color: #444;
            margin: 15px 0 5px 0;
            font-weight: 500;
        }

        .precio {
            font-size: 1.3rem;
            color: #e91e63; /* Color rosa moda */
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
